name: HAOS guards

# Guardas do fork HAOS. Arquivo do fork (não do upstream) de propósito: assim um
# rebase do upstream nunca conflita com estas checagens.
#
# 1. Nenhum default de path pode construir ~/.hermes — o home canônico é ~/.haos.
#    Sites legados intencionais levam `# haos-legacy-path: <motivo>`.
# 2. O contrato do default de home do fork fica verde (testes de comportamento).
# 3. Nenhum hint user-facing pode citar `hermes <cmd>` — o CLI é `haos`; use
#    product_command(). Sites intencionais levam `# haos-brand: <motivo>`.
#    Cobre código (string e comentário) e o markdown que o agente executa.
# 4. `uv.lock` em sincronia com `pyproject.toml`: todo job que usa
#    `uv sync --locked` morre quando o lock fica para trás.

on:
  push:
    branches: [main, haos-standalone]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haos-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-home-guard:
    name: Guard de path legado (~/.hermes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Forbid new ~/.hermes path defaults
        run: python scripts/ci/check_legacy_hermes_home.py

  brand-hints-guard:
    name: Guard de hint user-facing (hermes <cmd>)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Forbid user-facing hints naming the upstream CLI
        run: python scripts/ci/check_haos_brand_hints.py

  test-source-reads-guard:
    name: Ratchet de leitura de codigo-fonte em testes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # The root AGENTS.md bans reading source text in tests outright. The 110
      # existing reads are grandfathered per file; this fails on any NEW one, and
      # also when a count drops, so the ratchet can only tighten.
      - name: Forbid new tests that read source text
        run: python scripts/ci/check_test_source_reads.py

  lock-check:
    name: uv.lock em sincronia com pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # 10.1.0
        with:
          version: "0.9.28"

      - name: Lockfile must match pyproject.toml
        # `uv sync --locked` (tests.yml, tests-os.yml, docker.yml, e2e-desktop.yml,
        # este arquivo) falha em TODO job quando o lock fica para tras — foi o que
        # aconteceu no bump 0.21.2 + extra `fetch`. Checar aqui custa segundos e
        # aponta a causa em vez de deixar o erro aparecer no install de cada job.
        run: uv lock --check

  home-contract-tests:
    name: Contrato do home do fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # 10.1.0
        with:
          version: "0.9.28"

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        # Mesmo lock do tests.yml: env reprodutível, sem depender de requirements-dev.
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run home-contract tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh \
            tests/test_haos_default_home.py \
            tests/test_haos_no_legacy_home_defaults.py
