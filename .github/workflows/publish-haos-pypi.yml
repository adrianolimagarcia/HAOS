name: Publish HAOS to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository (pypi or testpypi)"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build-and-publish:
    name: Build wheel and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Necessário para Trusted Publishing no PyPI
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build HAOS distribution package
        env:
          HAOS_BUILD: "1"
          HAOS_PYPI_BUILD: "1"
        run: |
          python -m build packages/haos --outdir dist/
          twine check dist/*

      - name: Publish package to TestPyPI
        if: ${{ github.event.inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish package to PyPI
        if: ${{ github.event_name == 'release' || github.event.inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
