[package]
name = "haos-vector-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "haos_vector_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
