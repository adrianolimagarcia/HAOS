[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haos"
version = "1.1.0"
description = "HAOS (Hermes Agent Operating System) — Autonomous Multi-Agent OS, Control Plane & Swarm Orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Adriano Lima & HAOS Contributors", email = "adriano@dsh.org" }
]
keywords = ["haos", "agentic-os", "multi-agent", "kanban", "autonomous-agents", "control-plane", "hermes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "litellm>=1.50.0",
]

[project.scripts]
haos = "bin.haos:main"
haos-agent = "run_agent:main"
haos-controlplane = "hermes.platform.webui.standalone:main"

[project.urls]
Homepage = "https://github.com/adrianolimagarcia/hermes-agent"
Documentation = "https://github.com/adrianolimagarcia/hermes-agent/tree/haos-fork/docs/haos"
Repository = "https://github.com/adrianolimagarcia/hermes-agent.git"
