[package]
name = "hermes-exec"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hermes-exec"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "resource"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
