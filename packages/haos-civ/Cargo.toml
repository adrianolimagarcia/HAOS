[package]
name = "haos-civ"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rusqlite = { version = "0.33", features = ["bundled"] }
rand = "0.8"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"

[lib]
name = "haos_civ"
crate-type = ["cdylib", "rlib"]
