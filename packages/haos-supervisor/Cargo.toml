[package]
name = "haos-supervisor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "haos-supervisor"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
