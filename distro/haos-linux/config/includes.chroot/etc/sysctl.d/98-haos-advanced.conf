# ==============================================================================
# HAOS Linux - Advanced Epoll, IPC, MMap and Kernel Latency Tuning
# ==============================================================================

# 1. IPC & POSIX Message Queues (comunicação veloz entre agentes e daemons)
fs.epoll.max_user_watches = 2097152
fs.pipe-max-size = 4194304
fs.pipe-user-pages-hard = 0
fs.pipe-user-pages-soft = 0

# 2. VFS Cache Pressure (mantém inodes de arquivos e pastas de código/skills em RAM)
vm.vfs_cache_pressure = 50

# 3. Compaction e Fragmentação de Memória
vm.compaction_proactiveness = 20
vm.extfrag_threshold = 100

# 4. Kernel Task Scheduler Latency Tuning (respostas instantâneas para I/O e WebSockets)
kernel.sched_latency_ns = 4000000
kernel.sched_min_granularity_ns = 500000
kernel.sched_wakeup_granularity_ns = 1000000
kernel.sched_migration_cost_ns = 500000

# 5. eBPF e JIT Compiler Hardening + Performance
net.core.bpf_jit_enable = 1
net.core.bpf_jit_harden = 0
net.core.bpf_jit_kallsyms = 1

# 6. Desativação de NMI Watchdog em tempo de execução (elimina jitter de CPU)
kernel.nmi_watchdog = 0

# 7. Redução de latência em IPC Unix Domain Sockets
net.unix.max_dgram_qlen = 1024
