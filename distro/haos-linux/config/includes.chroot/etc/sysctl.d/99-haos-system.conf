# ==============================================================================
# HAOS Linux - System & Memory Tuning
# Otimizações de I/O, Memória Virtual, SQLite e Concorrência
# ==============================================================================

# Swappiness baixo para priorizar retenção em RAM e ZRAM
vm.swappiness = 10

# Controle de Dirty Pages para evitar travamentos de I/O em gravações em lote
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500

# Suporte massivo a arquivos abertos e mapeamentos de memória (Playwright / SQLite / Vector stores)
fs.file-max = 2097152
vm.max_map_count = 524288

# Async I/O (libaio / io_uring)
fs.aio-max-nr = 1048576

# Inotify watches expandidos para monitoramento de arquivos e skills em tempo real
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.inotify.max_queued_events = 32768

# Evita dumps desnecessários que travam o disco em caso de falha controlada
fs.suid_dumpable = 0
kernel.core_uses_pid = 1

# Prioridade e balanceamento de scheduler
kernel.sched_autogroup_enabled = 0
