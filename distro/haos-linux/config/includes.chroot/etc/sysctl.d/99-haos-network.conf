# ==============================================================================
# HAOS Linux - Network Tuning
# BBRv3 + FQ + Low-latency High-throughput TCP configuration
# ==============================================================================

# Definição de Qdisc (Fair Queueing) e Algoritmo de Congestionamento TCP (BBR)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Otimização de Buffers do Core de Rede
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.optmem_max = 2048576

# Buffers de Leitura e Escrita TCP (min, default, max)
# Otimizado para conexões simultâneas de streaming (LLM tokens / WebSocket / WebRTC)
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# Latência e Handshake
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 16384
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Capacidade de Backlog para Pico de Tráfego de Agentes
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 16384

# Proteções e Keepalive
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 15
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 3

# Habilitar encaminhamento IP para bridges e mesh routing caso necessário
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
