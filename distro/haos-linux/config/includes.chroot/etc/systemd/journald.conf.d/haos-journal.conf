[Journal]
# Persistente de propósito: em `volatile` o journal vive em /run (tmpfs) e todo o log do
# sistema — kernel, boot, ciclo de vida das unidades e a causa do shutdown — morre no reboot.
# O custo disso apareceu numa sessão de depuração real: "por que o nó reiniciou?" não tinha
# resposta porque o boot anterior não existia mais. Os logs do agente (~/.haos/logs/*.log) já
# eram persistentes; faltava o lado do sistema.
# Tetos explícitos porque é appliance: SystemMaxUse limita o disco usado, SystemMaxFileSize
# limita cada arquivo (rotação), MaxRetentionSec agora faz sentido (em volátil a retenção era
# por boot). RateLimit mantido para um serviço em loop não inundar o disco.
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=32M
MaxRetentionSec=7day
RateLimitIntervalSec=30s
RateLimitBurst=10000
