# ==============================================================================
# HAOS Linux - Unbound Local DNS Cache & Resolver Configuration
# Otimizado para baixa latência, prefetching e concorrência
# Upstreams: 9.9.9.9 (Quad9), 1.1.1.1 (Cloudflare), 8.8.8.8 (Google), 208.67.222.222 (OpenDNS)
# ==============================================================================

server:
    # Interfaces e Portas
    interface: 127.0.0.1
    interface: ::1
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Controle de Acesso (Apenas localhost)
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow

    # Otimização de Performance e Cache
    num-threads: 2
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Tamanhos de Memória de Cache (generosos para nós de IA)
    msg-cache-size: 64m
    rrset-cache-size: 128m

    # Prefetching agressivo: renova nomes acessados frequentemente antes de expirarem
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # TTLs (min 1 min, max 1 dia)
    cache-min-ttl: 60
    cache-max-ttl: 86400

    # Privacidade e Segurança
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no

    # Buffers de Socket
    so-rcvbuf: 4m
    so-sndbuf: 4m

# ==============================================================================
# Upstream Forwarders
# ==============================================================================
forward-zone:
    name: "."
    forward-first: no
    # Quad9 Primary (DNSSEC + Malware Blocking)
    forward-addr: 9.9.9.9
    # Cloudflare Primary (Fast Anycast)
    forward-addr: 1.1.1.1
    # Google Public DNS
    forward-addr: 8.8.8.8
    # OpenDNS / Cisco
    forward-addr: 208.67.222.222
