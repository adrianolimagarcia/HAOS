# HAOS DNS — transporte dos upstreams.
#
# Todo upstream carrega o IP explicitamente: o DoT valida o certificado pelo
# `#server_name` (SNI) e o DoH pelo `#ip` fixado na URL, então o daemon nunca
# precisa resolver o nome do próprio upstream (seria circular — ele é o
# resolvedor do nó). O UDP puro fica por último, como último recurso.
#
# Chaves canônicas: `listen_addr` e `cache_max_entries` (o que o distro já publicava).
# `listen`/`cache_entries` continuam aceitos como alias.
listen_addr = "127.0.0.1:53"
cache_ttl_seconds = 60
cache_max_entries = 10000
upstreams = [
  "9.9.9.9@853#dns.quad9.net",                     # DoT (RFC 7858)
  "1.1.1.1@853#cloudflare-dns.com",                # DoT
  "https://cloudflare-dns.com/dns-query#1.1.1.1",  # DoH (RFC 8484)
  "9.9.9.9:53",                                    # UDP puro
]
