# ==============================================================================
# HAOS Linux Appliance Configuration
# ==============================================================================

# Identificador do nó e rede
HAOS_NODE_ROLE="primary-agent"
HAOS_MESH_PORT=9121
HAOS_GATEWAY_PORT=8000

# Runtimes
HAOS_DEFAULT_PYTHON="/opt/haos/venv/bin/python"
HAOS_PLAYWRIGHT_PATH="/opt/haos/.playwright"

# Otimizações
HAOS_USE_MIMALLOC=1
HAOS_BTRFS_NOCOW=1
