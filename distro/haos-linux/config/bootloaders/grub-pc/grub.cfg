# ==============================================================================
# HAOS Linux GRUB Menu Configuration (Tema & Identidade)
# Kernel 6.18 LTS com Preempt Full + BBRv3 + Transparent Hugepages madvise
# ==============================================================================

set default=0
set timeout=5

# Cores do Menu do GRUB (Ciano sobre Preto)
set color_normal=cyan/black
set color_highlight=black/cyan

insmod all_video
insmod font
insmod gfxterm

set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

menuentry "Instalar HAOS Linux 1.0 (Btrfs zstd + Kernel 6.18 LTS - Preempt Full)" --class debian --class gnu-linux --class gnu --class os {
    linux   /live/vmlinuz boot=live components quiet splash transparent_hugepage=madvise mitigations=off preempt=full nowatchdog split_lock_mitigate=0 scsi_mod.use_blk_mq=1 pcie_aspm=performance nvme_core.default_ps_max_latency_us=0 processor.max_cstate=1 zswap.enabled=0
    initrd  /live/initrd.img
}

menuentry "HAOS Linux 1.0 (Modo Live RAM / Appliance)" --class debian --class gnu-linux --class gnu --class os {
    linux   /live/vmlinuz boot=live components toram quiet splash transparent_hugepage=madvise preempt=full mitigations=off zswap.enabled=0
    initrd  /live/initrd.img
}

menuentry "HAOS Linux 1.0 (Modo de Recuperação / Failsafe)" --class debian --class gnu-linux --class gnu --class os {
    linux   /live/vmlinuz boot=live components single nomodeset
    initrd  /live/initrd.img
}
