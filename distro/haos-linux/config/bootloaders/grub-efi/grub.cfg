# ==============================================================================
# HAOS Linux GRUB Menu Configuration (Tema & Identidade)
# Kernel 6.18 LTS com Preempt Full + BBRv3 + Transparent Hugepages madvise
# ==============================================================================

set default=0
set timeout=5

# Cores do Menu do GRUB (Ciano sobre Preto)
set color_normal=cyan/black
set color_highlight=black/cyan

insmod all_video
insmod font
insmod gfxterm

set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

menuentry "HAOS Linux 1.0 (Live — Kernel tunado: Preempt Full + I/O)" --class debian --class gnu-linux --class gnu --class os {
    linux   /live/vmlinuz boot=live components quiet splash transparent_hugepage=madvise mitigations=off preempt=full nowatchdog split_lock_mitigate=0 scsi_mod.use_blk_mq=1 pcie_aspm=performance nvme_core.default_ps_max_latency_us=0 processor.max_cstate=1 zswap.enabled=0
    initrd  /live/initrd.img
}

menuentry "HAOS Linux 1.0 (Modo Live RAM / Appliance)" --class debian --class gnu-linux --class gnu --class os {
    linux   /live/vmlinuz boot=live components toram quiet splash transparent_hugepage=madvise preempt=full mitigations=off zswap.enabled=0
    initrd  /live/initrd.img
}

menuentry "HAOS Linux 1.0 (Modo de Recuperação / Failsafe)" --class debian --class gnu-linux --class gnu --class os {
    linux   /live/vmlinuz boot=live components single nomodeset
    initrd  /live/initrd.img
}

# ==============================================================================
# Instalador de SO (debian-installer)
# ==============================================================================
# Este arquivo SUBSTITUI o menu que o live-build gera, e é o menu gerado que
# traz as entradas do instalador — sem o bloco abaixo o d-i fica presente na
# mídia (install/, pool-udeb/) e invisível no boot.
#
# O caminho do preseed tem de casar com --bootappend-install em auto/config.
# O append automático do live-build sai como `file=...`, SEM o prefixo
# `preseed/`, e o d-i ignora isso em silêncio — por isso ele é passado à mão lá
# e repetido aqui. Ver config/preseed/haos.cfg: a ISO não particiona disco.
set haos_preseed="preseed/file=/cdrom/install/preseed.cfg"

submenu "Instalar o HAOS Linux no disco ..." --hotkey=i {

    menuentry "Instalação (texto)" --hotkey=t {
        linux   /install/vmlinuz vga=788 $haos_preseed --- quiet
        initrd  /install/initrd.gz
    }

    menuentry "Instalação (gráfica)" --hotkey=g {
        linux   /install/gtk/vmlinuz vga=788 $haos_preseed --- quiet
        initrd  /install/gtk/initrd.gz
    }

    menuentry "Instalação automatizada (aplica o preseed)" --hotkey=a {
        linux   /install/vmlinuz auto=true priority=critical vga=788 $haos_preseed --- quiet
        initrd  /install/initrd.gz
    }

    menuentry "Modo de recuperação (rescue)" --hotkey=r {
        linux   /install/vmlinuz rescue/enable=true vga=788 $haos_preseed --- quiet
        initrd  /install/initrd.gz
    }
}
