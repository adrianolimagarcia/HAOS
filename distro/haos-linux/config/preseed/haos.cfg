# HAOS Linux — preseed do instalador (debian-installer)
#
# Chega ao d-i por `preseed/file=/cdrom/install/preseed.cfg`, passado no append
# de install em auto/config. O script installer_preseed do live-build concatena
# todos os config/preseed/*.cfg neste único /install/preseed.cfg na mídia, e o
# menu gerado oferece Install / Expert / Automated install nos modos gráfico e
# texto — este arquivo vale para todas as entradas.
#
# REGRA INVIOLÁVEL: aqui não se particiona, não se formata e não se apaga disco.
# A entrada "Automated install" roda com `auto=true priority=critical`, que
# consome em SILÊNCIO tudo que estiver preseedado — inclusive diretivas de
# partman. Como a ISO é um artefato distribuível, nenhuma diretiva destrutiva
# mora nela: a instalação automatizada de VM injeta um preseed próprio pela
# cmdline do hipervisor (ver README, "Instalação → Instalação automatizada").

# Espelho fixo: evita a detecção (lenta) e define o alvo do apt do sistema
# instalado, em vez de herdar o que o d-i achar na rede.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Componentes do apt iguais aos da imagem (auto/config: --archive-areas
# "main non-free non-free-firmware"), para o sistema instalado não divergir do
# live nem perder firmware non-free. `contrib` fica de fora porque a imagem
# também não o habilita.
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false

# Não participar do popularity-contest.
popularity-contest popularity-contest/participate boolean false

# Relógio em UTC (padrão de servidor). O fuso continua sendo escolha do
# operador — não é preseedado, como o resto da identidade da máquina.
d-i clock-setup/utc boolean true
d-i time/zone string UTC

# Rede: o d-i escolhe a interface sozinho (o appliance costuma ter uma só).
d-i netcfg/choose_interface select auto

# Segurança: exigir confirmação extra antes de destruir uma tabela de partições
# existente. Sem isto, o partman pode sobrescrever um disco com dados sem aviso.
d-i partman/confirm_nooverwrite boolean true

# O /etc/default/grub da imagem é customizado, então o postinst do grub2 o
# encontra como conffile modificado e pergunta (template `ucf/changeprompt`,
# tipo select) o que fazer — pergunta CRÍTICA, que trava a instalação
# automatizada. Manter a versão local é a resposta correta para o appliance:
# é ela que carrega o cmdline de kernel do HAOS.
d-i ucf/changeprompt select keep the local version currently installed

# NÃO PRESEEDADO DE PROPÓSITO — o operador responde:
#   locale, teclado, fuso horário, hostname, domínio, usuário/senha e TODO o
#   particionamento (partman-auto/*, partman/confirm, partman-auto/disk).
# Preseedar particionamento apagaria disco sem confirmação em qualquer boot da
# ISO; preseedar locale/teclado imporia a escolha de um operador a todos.
